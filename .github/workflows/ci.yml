name: CI

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      # `pdfinfo` y `pdftotext` de poppler son dependencias del extractor de PDFs.
      # Estan en la imagen del proyecto (Dockerfile instala poppler-utils), pero
      # el runner de Ubuntu no los trae: sin este paso la suite fallaba con
      # `pdf_tool_missing` y el CI quedaba en rojo sin que el codigo estuviera mal.
      - name: Install poppler-utils (PDF extraction)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
        continue-on-error: true

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run the complete pytest suite
        run: python -m pytest -q

      - name: Validate project control catalog and generated docs (when present)
        if: ${{ hashFiles('tools/project_control.py') != '' }}
        run: |
          python tools/project_control.py validate
          python tools/project_control.py check
