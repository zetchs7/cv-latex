name: CI

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run the complete pytest suite
        run: python -m pytest -q

      - name: Validate project control catalog and generated docs (when present)
        if: ${{ hashFiles('tools/project_control.py') != '' }}
        run: |
          python tools/project_control.py validate
          python tools/project_control.py check
